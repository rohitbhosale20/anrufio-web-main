<!-- Section Container -->
<section *ngIf="coreCompetencies.heading" class="bg-white text-gray-900 py-16 px-6">
  
    <!-- Left-Aligned Upper Heading -->
    <div class="max-w-6xl mx-auto">
      <p class="text-sm font-semibold text-red-500 uppercase tracking-wide">{{coreCompetencies.head}}</p>
    </div>

    <!-- Left-Aligned Main Heading & Subheading -->
    <div class="max-w-6xl mx-auto mt-2">
      <h2 class="text-4xl font-bold text-gray-900">{{ coreCompetencies.heading }}</h2>
      <p class="mt-4 text-gray-600 text-lg">{{ coreCompetencies.subheading }}</p>
    </div>
  
    <!-- Grid Layout -->
    <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto">
      
      <!-- Dynamic Cards -->
      <div *ngFor="let competency of coreCompetencies.items" class="bg-gray-100 rounded-lg p-6 text-gray-900">
        <div class="flex items-start">
          <img [src]="competency.icon" [alt]="competency.title" class="w-12">
        </div>
        <h3 class="text-xl font-semibold mt-4">{{ competency.title }}</h3>
        <p class="text-gray-600 mt-2">
          {{ competency.description }}
        </p>
      </div>
  
    </div>
</section>
