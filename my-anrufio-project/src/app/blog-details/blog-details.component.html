<div class="container mx-auto px-4 py-6 flex flex-col lg:flex-row gap-8">
  <!-- Left Section (Dynamic Content) -->
  <div class="lg:w-2/3 overflow-auto h-[calc(100vh-5rem)]">
    <div *ngIf="program" class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-3xl font-bold text-gray-900">{{ program.title }}</h2>
      <img *ngIf="program.image" [src]="program.image" 
           [alt]="program.title" 
           class="rounded-md mb-4 w-full object-cover"
           loading="lazy">
      <p class="text-gray-600 text-lg"><strong>Duration:</strong> {{ program.duration }}</p>
      <p class="text-gray-600 text-lg"><strong>Cohort Starts:</strong> {{ program.cohort_start }}</p>
      <p class="text-gray-700 mt-3 leading-relaxed">
        {{ program.description || 'No additional details available.' }}
      </p>
      <a *ngIf="program.link" [href]="program.link" 
         class="mt-4 inline-block text-blue-600 font-semibold hover:underline">
        Enroll Now
      </a>
    </div>

    <!-- Message if no program found -->
    <div *ngIf="!program" class="text-center text-gray-600">
      <p>Program not found.</p>
    </div>
  </div>

  <!-- Right Section (Sticky Form) -->
  <div class="lg:w-1/3">
    <div class="sticky top-20 bg-white p-6 rounded-xl shadow-lg">
      <h3 class="text-2xl font-bold text-gray-900 mb-4">Enroll Now</h3>
      <form>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Full Name</label>
          <input type="text" placeholder="Enter your name" 
                 class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Email</label>
          <input type="email" placeholder="Enter your email" 
                 class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Phone Number</label>
          <input type="text" placeholder="Enter your phone number" 
                 class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Company Name</label>
          <input type="text" placeholder="Enter company name" 
                 class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Job Title</label>
          <input type="text" placeholder="Enter job title" 
                 class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Preferred Mode of Contact</label>
          <select class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            <option>Email</option>
            <option>Phone</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium">Message/Comments</label>
          <textarea rows="3" placeholder="Enter your message..." 
                    class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md font-semibold hover:bg-blue-700 transition">
          Submit
        </button>
      </form>
    </div>
  </div>
</div>
