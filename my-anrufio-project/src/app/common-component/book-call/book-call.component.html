<section class="relative bg-cover bg-center text-white py-12"
    [ngStyle]="{'background-image': 'url(' + data.backgroundImage + ')'}">
    <div class="absolute inset-0 bg-red-800 bg-opacity-80"></div>
    
    <div class="relative max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center md:items-start">
        <!-- Left Side: Text Content -->
        <div class="w-full md:w-2/3 text-left">
            <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold">
                {{ data.title }}
            </h2>
            <p class="mt-4 text-gray-300 max-w-2xl">
                {{ data.description }}
            </p>
            <div class="mt-6">
                <a [routerLink]="data.btnLink" (click)="onBookCallClick()"
                    class="inline-block bg-white text-red-800 font-semibold px-6 py-3 rounded shadow-lg transition 
                    hover:bg-red-700 hover:text-white">
                    {{ data.btnText }}
                </a>
            </div>
        </div>

        <!-- Right Side: Angular Logo -->
        <div class="w-full md:w-1/3 flex items-center justify-end">
            <img src="assets/icons/angular.svg" alt="Angular Logo" class="h-40 w-auto">
        </div>
    </div>
</section>
