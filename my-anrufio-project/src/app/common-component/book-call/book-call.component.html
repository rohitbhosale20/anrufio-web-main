<section *ngFor="let item of data" 
    class="relative bg-cover bg-center text-white py-12" 
    [ngStyle]="{'background-image': 'url(' + item.backgroundImage + ')'}">
    
    <!-- Dynamic Background Overlay -->
    <div class="absolute inset-0" [ngStyle]="{'background-color': item.bgColor, 'opacity': '0.8'}"></div>
    
    <div class="relative max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center md:items-start">
        <!-- Left Side: Text Content -->
        <div class="w-full md:w-2/3 text-left">
            <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold">
                {{ item.title }}
            </h2>
            <p class="mt-4 text-gray-300 max-w-2xl">
                {{ item.description }}
            </p>
            <div class="mt-6">
                <a [routerLink]="item.btnLink" (click)="onBookCallClick()"
                    class="inline-block font-semibold px-6 py-3 rounded shadow-lg transition"
                    [ngClass]="[item.btnColor, item.btnHoverColor]">
                    {{ item.btnText }}
                </a>
            </div>
        </div>

        <!-- Right Side: Logo -->
        <div class="w-full md:w-1/3 flex items-center justify-end">
            <img [src]="item.logo" alt="React Logo" class="h-40 w-auto">
        </div>
    </div>
</section>
